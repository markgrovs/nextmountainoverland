[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.166.0"
  HUGO_ENV = "production"

# Production context (main branch)
[context.production]
  command = "hugo --gc --minify --baseURL https://nextmountainoverland.com/"
  [context.production.environment]
    HUGO_ENV = "production"

# Preview branch deploy context
[context.preview]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"
  [context.preview.environment]
    HUGO_ENV = "preview"

# Pull-request preview.
[context.deploy-preview]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"
  [context.deploy-preview.environment]
    HUGO_ENV = "preview"

# Default branch-deploy fallback for other branches (like drafts/backup)
[context.branch-deploy]
  command = "echo 'Skipping build for non-preview branch' && exit 0"

[[redirects]]
  from = "/rss"
  to = "/index.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep existing Journal links valid after the Travelbook activation.
[[redirects]]
  from = "/posts"
  to = "/dispatches/"
  status = 301

[[redirects]]
  from = "/posts/"
  to = "/dispatches/"
  status = 301

[[redirects]]
  from = "/posts/*"
  to = "/dispatches/:splat"
  status = 301
