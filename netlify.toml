[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.151.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# Production context (main branch)
[context.production]
  command = "hugo --gc --minify --baseURL https://nextmountainoverland.com/"
  [context.production.environment]
    HUGO_ENV = "production"

# Preview branch deploy context
[context.preview]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL https://preview.nextmountainoverland.com/"
  [context.preview.environment]
    HUGO_ENV = "preview"

# Default branch-deploy fallback for other branches (like drafts/backup)
[context.branch-deploy]
  command = "echo 'Skipping build for non-preview branch' && exit 0"

[[redirects]]
  from = "/rss"
  to = "/index.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
